version: 0.2

phases:
  build:
    commands:
      - echo "START BUILD"
      - rm -f chichicux.zip function.zip response.json event.json lambda_actual.zip || true

      - echo "LIST ROOT"
      - ls -lah

      - echo "LIST FUNCTION DIR"
      - ls -lah function

      - echo "ZIP PACKAGE"
      - cd function
      - zip -r ../chichicux.zip .
      - cd ..

      - echo "ZIP CONTENT"
      - unzip -l chichicux.zip

      - echo "CHECK NO NESTED ZIP"
      - unzip -l chichicux.zip | grep -q "function.zip" && echo "ERROR nested zip found" && exit 1 || echo "OK nested zip not found"

      - echo "CHECK APP"
      - unzip -l chichicux.zip | grep -q " app.py" || exit 1

      - echo "CHECK SUMA"
      - unzip -l chichicux.zip | grep -q " suma.py" || exit 1

      - echo "DEPLOY"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://chichicux.zip
