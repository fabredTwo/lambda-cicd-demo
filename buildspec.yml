version: 0.2

phases:
  build:
    commands:
      - echo "Empaquetando Lambda..."
      - zip -r function.zip app.py suma.py
      # Opcional: puedes dejar el cp si quieres tener un respaldo en la raíz del bucket
      - aws s3 cp function.zip s3://cicd-bucket-uno/function.zip

artifacts:
  files:
    - function.zip
  proxy-artifact: yes