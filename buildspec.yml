version: 0.2

phases:
  build:
    commands:
      - echo "PACKAGE app.py suma.py __init__.py"
      - zip -j deploy.zip app.py suma.py __init__.py
      - echo "ZIP CONTENT"
      - unzip -l deploy.zip
      - echo "DEPLOY"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://deploy.zip
