version: 0.2

phases:
  build:
    commands:
      - echo "Empaquetando Lambda desde function/ pero dejando app.py en root del zip..."
      - rm -f chichicux.zip

      - cd function
      - zip -r ../chichicux.zip .
      - cd ..

      - echo "Contenido del zip:"
      - unzip -l chichicux.zip

      - echo "Deploy..."
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://chichicux.zip
