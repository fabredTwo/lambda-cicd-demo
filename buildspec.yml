version: 0.2

phases:
  build:
    commands:
      - echo "START BUILD"
      - rm -f deploy.zip || true

      - echo "PACKAGE deploy folders"
      - cd deploy
      - zip -r ../deploy.zip .
      - cd ..

      - echo "ZIP CONTENT"
      - unzip -l deploy.zip

      - echo "DEPLOY TO LAMBDA"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://deploy.zip
