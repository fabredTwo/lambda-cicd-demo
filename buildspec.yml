version: 0.2

phases:
  build:
    commands:
      - echo "START BUILD"
      - rm -f chichicux.zip function.zip response.json event.json lambda_actual.zip || true

      - echo "PWD:"
      - pwd

      - echo "LIST ROOT:"
      - ls -lah

      - echo "LIST function:"
      - ls -lah function

      - echo "ZIP from function folder"
      - cd function
      - zip -r ../chichicux.zip .
      - cd ..

      - echo "ZIP CONTENT"
      - unzip -l chichicux.zip

      - echo "CHECK nested function.zip"
      - unzip -l chichicux.zip | grep -q "function.zip"
      - if [ $? -eq 0 ]; then echo "ERROR function.zip nested"; exit 1; fi

      - echo "CHECK app.py exists"
      - unzip -l chichicux.zip | grep -q " app.py"
      - if [ $? -ne 0 ]; then echo "ERROR app.py missing"; exit 1; fi

      - echo "DEPLOY"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://chichicux.zip
