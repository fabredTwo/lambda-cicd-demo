version: 0.2

phases:
  build:
    commands:
      - echo "START BUILD"
      - rm -f chichicux.zip function.zip response.json event.json lambda_actual.zip || true

      - echo "PWD:"
      - pwd

      - echo "LIST ROOT:"
      - ls -lah

      - echo "LIST function:"
      - ls -lah function

      - echo "ZIP from function folder"
      - cd function
      - zip -r ../chichicux.zip .
      - cd ..

      - echo "ZIP CONTENT"
      - unzip -l chichicux.zip

      - echo "CHECK: function.zip must NOT be inside"
      - unzip -l chichicux.zip | grep -q "function.zip" && echo "ERROR function.zip nested" && exit 1 || echo "OK no nested zip"

      - echo "CHECK: app.py MUST be present"
      - unzip -l chichicux.zip | grep -q " app.py" && echo "OK app.py found" || (echo "ERROR app.py missing" && exit 1)

      - echo "DEPLOY"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://chichicux.zip
