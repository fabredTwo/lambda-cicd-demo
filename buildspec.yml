version: 0.2

phases:
  build:
    commands:
      - echo "START BUILD"
      - rm -rf dist deploy.zip || true
      - mkdir dist

      - echo "Copy lambda source files"
      - cp src_lambda/app.py dist/app.py
      - cp src_lambda/suma.py dist/suma.py
      - cp src_lambda/__init__.py dist/__init__.py

      - echo "Package deploy.zip from dist"
      - cd dist
      - zip -r ../deploy.zip .
      - cd ..

      - echo "ZIP CONTENT"
      - unzip -l deploy.zip

      - echo "Deploy to Lambda"
      - aws lambda update-function-code --function-name suma-cicd --zip-file fileb://deploy.zip
