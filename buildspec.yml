version: 0.2

env:
  variables:
    FUNCTION_NAME: "suma-cicd"
    AWS_DEFAULT_REGION: "us-east-1"

phases:
  build:
    commands:
      - echo "=== DEBUG: WHOAMI / REGION ==="
      - aws --version
      - aws sts get-caller-identity
      - echo "REGION=$AWS_DEFAULT_REGION"

      - echo "=== DEBUG: WORKDIR ==="
      - pwd
      - ls -la

      - echo "=== DEBUG: BUILD ZIP ==="
      - rm -f function.zip
      - zip -r function.zip app.py suma.py

      - echo "=== DEBUG: ZIP CONTENT ==="
      - unzip -l function.zip

      - echo "=== DEBUG: ZIP HASH (to compare) ==="
      - sha256sum function.zip || shasum -a 256 function.zip || certutil -hashfile function.zip SHA256

      - echo "=== DEBUG: DEPLOY ZIP TO LAMBDA ==="
      - aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://function.zip

      - echo "=== DEBUG: GET LAMBDA CONFIG AFTER DEPLOY ==="
      - aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query '{Runtime:Runtime,Handler:Handler,LastModified:LastModified,Version:Version}'

      - echo "=== DEBUG: INVOKE ==="
      - aws lambda invoke --function-name "$FUNCTION_NAME" --payload "{}" response.json
      - cat response.json

artifacts:
  files:
    - function.zip
    - response.json
