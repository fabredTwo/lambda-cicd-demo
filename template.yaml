AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2025-09-09
Description: Lambda suma con CI/CD usando SAM v2

Resources:
  SumaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: suma-lambda-cicd
      Runtime: python3.12
      Handler: app.lambda_handler
      CodeUri: .
      MemorySize: 128
      Timeout: 5
      Policies:
        - AWSLambdaBasicExecutionRole
